<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <title>Água escura: ondulação larga</title>
  <!-- Superfície da água vista de cima: ruído fractal iluminado de lado, centrado no cinza médio
       para ser usado com background-blend-mode: overlay sobre a cor da faixa. Repete sem emenda. -->
  <filter id="w" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.035 0.07" numOctaves="4" seed="9" stitchTiles="stitch" result="n"/>
    <feDiffuseLighting in="n" lighting-color="#fff" surfaceScale="3" result="l">
      <feDistantLight azimuth="225" elevation="38"/>
    </feDiffuseLighting>
    <feColorMatrix in="l" type="saturate" values="0" result="g"/>
    <feComponentTransfer in="g">
      <feFuncR type="linear" slope="1.046" intercept="-0.13"/>
      <feFuncG type="linear" slope="1.046" intercept="-0.13"/>
      <feFuncB type="linear" slope="1.046" intercept="-0.13"/>
    </feComponentTransfer>
  </filter>
  <rect width="600" height="600" filter="url(#w)"/>
</svg>
