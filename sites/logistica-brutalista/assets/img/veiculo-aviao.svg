<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <title>Avião cargueiro visto de cima</title>
  <defs>
    <linearGradient id="fus" x1="0" x2="1">
      <stop offset="0" stop-color="#b8c0c7"/>
      <stop offset=".3" stop-color="#eef1f3"/>
      <stop offset=".55" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#aab3bb"/>
    </linearGradient>
    <linearGradient id="asa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3f5f6"/>
      <stop offset="1" stop-color="#cdd4da"/>
    </linearGradient>
    <linearGradient id="motor" x1="0" x2="1">
      <stop offset="0" stop-color="#c2360c"/>
      <stop offset=".45" stop-color="#ff5a26"/>
      <stop offset="1" stop-color="#b8330b"/>
    </linearGradient>
  </defs>
  <g stroke="#0c0c0c" stroke-opacity=".2" stroke-width="2" stroke-linejoin="round">
    <!-- asas (enflechadas) -->
    <path d="M368 296 72 494l-6 40 302-102Z" fill="url(#asa)"/>
    <path d="M432 296 728 494l6 40-302-102Z" fill="url(#asa)"/>
    <!-- motores, à frente do bordo de ataque -->
    <rect x="222" y="352" width="40" height="96" rx="16" fill="url(#motor)"/>
    <rect x="538" y="352" width="40" height="96" rx="16" fill="url(#motor)"/>
    <!-- estabilizadores -->
    <path d="M374 640 252 718l-2 30 126-34Z" fill="url(#asa)"/>
    <path d="M426 640 548 718l2 30-126-34Z" fill="url(#asa)"/>
    <!-- fuselagem -->
    <path d="M400 26c27 0 39 40 39 90v522c0 52-19 104-39 132-20-28-39-80-39-132V116c0-50 12-90 39-90Z" fill="url(#fus)"/>
  </g>
  <!-- cabine e deriva -->
  <path d="M384 78c4-10 28-10 32 0l-2 10c-8-4-20-4-28 0Z" fill="#26323b"/>
  <rect x="397" y="650" width="6" height="112" rx="3" fill="#9aa3ab"/>
  <!-- linha da porta de carga -->
  <rect x="371" y="150" width="58" height="2" fill="#0c0c0c" opacity=".12"/>
</svg>
